name: Compilar PRESUPUESTO

on:
  push:
    paths: ["presupuesto/**", ".github/workflows/presupuesto.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presupuesto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas
        run: ./gradlew testDebugUnitTest

      # Si existe el secreto KEYSTORE_BASE64 se firma con tu clave fija (las actualizaciones se instalan encima).
      # Si no, se genera un APK firmado con la clave de depuración, instalable pero sin actualizaciones directas.
      - name: Compilar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=presupuesto\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../PRESUPUESTO.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../PRESUPUESTO.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: presupuesto-apk
          path: PRESUPUESTO.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="presupuesto-v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" ../PRESUPUESTO.apk --title "PRESUPUESTO $TAG" --notes "APK compilado automáticamente."
